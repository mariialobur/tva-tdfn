name: Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/quality.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Archive Playwright report and visual references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdfn-playwright-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

name: Fix evaluation CSS cache

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-eval-css-cache.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix cache version and smoke assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('evaluation.css?v=17.2.0','evaluation.css?v=17.2.1')
          p.write_text(s,encoding='utf-8')
          p=Path('smoke-test.mjs')
          s=p.read_text(encoding='utf-8')
          old="assert.match(h,/evaluation\\.js\\?v=17\\.2\\.1/);"
          new=old+" assert.match(h,/evaluation\\.css\\?v=17\\.2\\.1/);"
          if old not in s: raise SystemExit('smoke anchor missing')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - run: node smoke-test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smoke-test.mjs
          git commit -m "fix: align evaluation CSS cache version"
          git push origin main

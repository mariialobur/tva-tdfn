.memo-section-title{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:7px 2px 0;padding:10px 2px 3px;border-bottom:1px solid var(--line)}.memo-section-title span{color:var(--brand-dark);font-size:.92rem;font-weight:850;text-transform:uppercase;letter-spacing:.045em}.memo-section-title small{color:var(--muted);font-size:.8125rem}

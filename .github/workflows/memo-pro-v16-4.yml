name: Professional TDFN memo v16.4

on:
  push:
    branches:
      - memo-pro-v16.4
    paths:
      - .github/workflows/memo-pro-v16-4.yml

permissions:
  contents: write

jobs:
  update-memo:
    if: "${{ !contains(github.event.head_commit.message, '[memo-v16.4]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memo-pro-v16.4
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover and run reviewed memo integration script
        shell: bash
        run: |
          git show 937178ea4e154500350f3d819d991d6d0aeb1e86:.github/workflows/memo-pro-v16-4.yml > /tmp/memo-source.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('/tmp/memo-source.yml').read_text(encoding='utf-8')
          start = src.index("          node --input-type=module <<'NODE'") + len("          node --input-type=module <<'NODE'\n")
          end = src.index("\n          NODE", start)
          script = textwrap.dedent(src[start:end])
          Path('/tmp/update-memo.mjs').write_text(script, encoding='utf-8')
          PY
          node /tmp/update-memo.mjs

      - name: Validate memo release
        shell: bash
        run: |
          node --check app.js
          node --check data.js
          node --check evaluation.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html','utf8');
          const css = fs.readFileSync('styles.css','utf8');
          const { CASES } = await import('./data.js');
          if (CASES.filter(c => !c.excludeFromProgress).length !== 43) throw new Error('Expected 43 evaluated cases');
          const required = ['Mémo professionnel TDFN','art. 81, al. 3, OTVA','trois périodes fiscales précédentes','art. 88, al. 2, OTVA','art. 77, al. 3, OTVA','240 jours','années écoulées','CHF 5’005’000','Pièges fréquents','Réflexe fiduciaire'];
          for (const text of required) if (!html.includes(text)) throw new Error(`Missing memo text: ${text}`);
          if (!css.includes('v16.4 — professional TDFN memo')) throw new Error('Memo CSS missing');
          if (!html.includes('styles.css?v=16.4.0')) throw new Error('CSS cache version missing');
          if (html.includes('audit-fixes.js')) throw new Error('Runtime audit patch must remain absent');
          console.log('Professional memo validated; 43 evaluated cases preserved.');
          NODE

      - name: Commit memo update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css package.json
          git rm --ignore-unmatch .github/workflows/memo-pro-v16-4.yml
          git commit -m "feat: expand professional TDFN memo [memo-v16.4]"
          git push origin memo-pro-v16.4

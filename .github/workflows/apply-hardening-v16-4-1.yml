name: Apply v16.4.1 hardening

on:
  push:
    branches: [hardening-v16.4.1]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-v16.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/fix-hardening-script.py
      - run: node scripts/apply-hardening-v16-4-1.mjs
      - run: node --check app.js
      - run: node --check data.js
      - run: node --check evaluation.js
      - run: node --check store.js
      - run: node smoke-test.mjs
      - run: node tests/unit.mjs
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js data.js evaluation.js evaluation.css store.js README.md package.json smoke-test.mjs tests .github/workflows/quality.yml
          git rm -f --ignore-unmatch .github/workflows/apply-hardening-v16-4-1.yml scripts/apply-hardening-v16-4-1.mjs scripts/fix-hardening-script.py .hardening-trigger
          git commit -m "v16.4.1 — production hardening [hardening-applied]"
          git push origin hardening-v16.4.1
